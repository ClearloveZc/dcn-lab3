name: dcn-lab3
services:
  as:
    build: ./AS
    image: leonchai/dcn-lab3-as:1.0
    ports:
      - "127.0.0.1:53533:53533/udp"
    volumes:
      - as-data:/data
    restart: unless-stopped
  fs:
    build: ./FS
    image: leonchai/dcn-lab3-fs:1.0
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
  us:
    build: ./US
    image: leonchai/dcn-lab3-us:1.0
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
volumes:
  as-data:
