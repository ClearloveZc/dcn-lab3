apiVersion: v1
kind: Namespace
metadata:
  name: dcn-lab3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: as-data
  namespace: dcn-lab3
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: as
  namespace: dcn-lab3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lab3-as
  template:
    metadata:
      labels:
        app: lab3-as
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: as
          image: leonchai/dcn-lab3-as:1.0
          ports:
            - containerPort: 53533
              protocol: UDP
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - name: records
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(1); s.sendto(b'TYPE=A\\nNAME=health.invalid\\n',('127.0.0.1',53533)); assert s.recv(4096)"
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: records
          persistentVolumeClaim:
            claimName: as-data
---
apiVersion: v1
kind: Service
metadata:
  name: as
  namespace: dcn-lab3
spec:
  type: NodePort
  selector:
    app: lab3-as
  ports:
    - port: 53533
      targetPort: 53533
      nodePort: 30001
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fs
  namespace: dcn-lab3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab3-fs
  template:
    metadata:
      labels:
        app: lab3-fs
    spec:
      containers:
        - name: fs
          image: leonchai/dcn-lab3-fs:1.0
          ports:
            - containerPort: 9090
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 9090}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 9090}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fs
  namespace: dcn-lab3
spec:
  type: NodePort
  selector:
    app: lab3-fs
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30002
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: us
  namespace: dcn-lab3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab3-us
  template:
    metadata:
      labels:
        app: lab3-us
    spec:
      containers:
        - name: us
          image: leonchai/dcn-lab3-us:1.0
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: us
  namespace: dcn-lab3
spec:
  type: NodePort
  selector:
    app: lab3-us
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30003
      protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: register-fibonacci
  namespace: dcn-lab3
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: leonchai/dcn-lab3-fs:1.0
          command: [python, -u, -c]
          args:
            - |
              import json, socket, time, urllib.request
              for attempt in range(60):
                  try:
                      body = json.dumps({'hostname': 'fibonacci.com', 'ip': socket.gethostbyname('fs'), 'as_ip': 'as', 'as_port': '53533'}).encode()
                      req = urllib.request.Request('http://fs:9090/register', data=body, method='PUT', headers={'Content-Type': 'application/json'})
                      with urllib.request.urlopen(req, timeout=8) as response:
                          assert response.status == 201
                          print(response.status, response.read().decode().strip())
                      break
                  except Exception as exc:
                      print('Waiting for services:', exc)
                      time.sleep(3)
              else:
                  raise SystemExit('registration failed')
